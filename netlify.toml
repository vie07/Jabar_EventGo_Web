# Konfigurasi deploy Netlify (tugas bersama Anggota E).
# Vercel memakai vercel.json. Keduanya mengarahkan semua path ke index.html
# karena aplikasi memakai BrowserRouter (supaya refresh di /kelola-event tidak 404).
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
